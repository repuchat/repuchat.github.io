<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="noindex" name="robots"/>
<title data-ru="Оплата — REPотека">Payment — REPuchat</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: #050807; color: #F4F5F7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 452px; padding: 0 16px; text-align: center; }
    .logo { width: 220px; max-width: 70%; }
    h1 { font-size: 28px; margin: 24px 0 8px; }
    p { color: rgba(244, 245, 247, .65); line-height: 1.5; }
    .open {
      display: block; margin: 28px 0 12px; padding: 18px; border-radius: 999px;
      background: #F1F3EC; color: #0A0F0B; font-weight: 700; font-size: 18px;
      text-decoration: none;
    }
  </style>
</head>
<body>
<main>
<img alt="REPuchat" class="logo" data-ru-src="../logo.ru.svg" src="../logo.svg"/>
<h1 data-ru="Спасибо!">Thank you!</h1>
<p data-ru="Как только ЮKassa подтвердит оплату, всё включится само — обычно за минуту.">Once ЮKassa confirms the payment, everything turns on by itself, usually within a minute.</p>
<a class="open" data-ru="Вернуться в приложение" href="../app/" id="open">Back to the app</a>
</main>
<script>
    const isRussian = (navigator.language || 'en').toLowerCase().startsWith('ru');
    if (isRussian) {
      document.documentElement.lang = 'ru';
      for (const el of document.querySelectorAll('[data-ru]')) el.innerHTML = el.dataset.ru;
      for (const el of document.querySelectorAll('img[data-ru-src]')) {
        el.src = el.dataset.ruSrc;
        el.alt = 'REPотека';
      }
    }
    // On Android the app itself; elsewhere the web app.
    if (/Android/i.test(navigator.userAgent)) {
      document.getElementById('open').href =
        'intent://paid#Intent;scheme=repuchat;package=com.awi.repuchat;end';
    }
  </script>
</body>
</html>
