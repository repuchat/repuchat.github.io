<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="noindex" name="robots"/>
<title data-ru="Приглашение в REPотеку">An invite to REPuchat</title>
<meta content="An invite to a REPuchat group" property="og:title"/>
<meta content="+REP and −REP among friends" property="og:description"/>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: #050807; color: #F4F5F7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 452px; padding: 0 16px; text-align: center; }
    .logo { width: 220px; max-width: 70%; }
    h1 { font-size: 28px; margin: 24px 0 8px; }
    p { color: rgba(244, 245, 247, .65); line-height: 1.5; margin: 8px 0; }
    .open {
      display: block; margin: 28px 0 12px; padding: 18px; border-radius: 999px;
      background: #F1F3EC; color: #0A0F0B; font-weight: 700; font-size: 18px;
      text-decoration: none;
    }
    p a { color: #F1F3EC; }
    .small { font-size: 14px; }
    .noapp {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin: 20px 0 8px; font-size: 17px; color: rgba(244, 245, 247, .75);
    }
    .get {
      padding: 10px 22px; border-radius: 999px; background: #BCFF04; color: #0A0F0B;
      font-weight: 700; text-decoration: none; text-transform: uppercase;
      letter-spacing: .04em; box-shadow: 0 0 24px rgba(188, 255, 4, .25);
    }
    .copy {
      display: block; width: 100%; padding: 14px; border-radius: 999px;
      border: 1px solid rgba(244, 245, 247, .25); background: none; color: inherit;
      font: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
<main>
<img alt="REPuchat" class="logo" data-ru-src="../logo.ru.svg" src="../logo.svg"/>
<h1 data-ru="Тебя зовут в группу">You're invited to a group</h1>
<p data-ru="Друзья дают друг другу +REP и −REP с причинами. Открой приглашение в приложении.">Friends give each other +REP and −REP with reasons. Open the invite in the app.</p>
<a class="open" data-ru="Открыть в REPотеке" href="#" id="open">Open in REPuchat</a>
<button class="copy" data-ru="Скопировать приглашение" id="copy" type="button">Copy the invite</button>
<div class="noapp">
<span data-ru="Нет приложения?">No app?</span>
<a class="get" data-ru="Скачать" href="../get/">Get it</a>
</div>
<p class="small" data-ru="Приложение есть, но не открылось? Открой REPотеку → Вступить и вставь приглашение.">Have the app, but it didn't open? Open REPuchat → Join and paste the invite.</p>
</main>
<script>
    const isRussian = (navigator.language || 'en').toLowerCase().startsWith('ru');
    if (isRussian) {
      document.documentElement.lang = 'ru';
      for (const el of document.querySelectorAll('[data-ru]')) el.innerHTML = el.dataset.ru;
      for (const el of document.querySelectorAll('img[data-ru-src]')) {
        el.src = el.dataset.ruSrc;
        el.alt = 'REPотека';
      }
    }
    const en = !isRussian;
    const token = location.hash.slice(1);
    // Chrome on Android opens an app by an intent link; elsewhere the app's own one.
    const android = /Android/i.test(navigator.userAgent);
    // Without the Android app (an iPhone, a computer): the web app takes it.
    const open = document.getElementById('open');
    open.href = android
      ? 'intent://join/' + token + '#Intent;scheme=repuchat;package=com.awi.repuchat;end'
      : '../app/#/?join=' + token;
    if (!android) open.textContent = en ? 'Open in the browser' : 'Открыть в браузере';
    document.getElementById('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        document.getElementById('copy').textContent = en ? 'Copied' : 'Скопировано';
      } catch (_) {
        prompt(en ? 'Copy the invite:' : 'Скопируй приглашение:', location.href);
      }
    };
    // The token, and an encrypted group's key after a dot.
    if (!/^([A-Za-z0-9_-]{16}|[A-Za-z0-9_-]{43})(\.([A-Za-z0-9_-]{22}|[A-Za-z0-9_-]{43}))?$/.test(token)) {
      document.querySelector('h1').textContent = en ? 'Invite not found' : 'Приглашение не найдено';
      document.getElementById('open').style.display = 'none';
      document.getElementById('copy').style.display = 'none';
    }
  </script>
</body>
</html>
