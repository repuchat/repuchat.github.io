<!doctype html>
<!-- An invite into a REPотека group: https://<site>/join#<token>. On a phone with
     the app, Android opens the app straight away (an App Link, see
     .well-known/assetlinks.json); otherwise this page opens it with a tap. The
     token after # never leaves the phone: browsers don't send it to the site.
     In Russian or English by the phone's language. -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-en="An invite to REPuchat">Приглашение в REPотеку</title>
  <meta property="og:title" content="Приглашение в группу REPотеки">
  <meta property="og:description" content="+REP и −REP среди своих">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: #050807; color: #F4F5F7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 452px; padding: 0 16px; text-align: center; }
    .logo { width: 220px; max-width: 70%; }
    h1 { font-size: 28px; margin: 24px 0 8px; }
    p { color: rgba(244, 245, 247, .65); line-height: 1.5; margin: 8px 0; }
    .open {
      display: block; margin: 28px 0 12px; padding: 18px; border-radius: 999px;
      background: #F1F3EC; color: #0A0F0B; font-weight: 700; font-size: 18px;
      text-decoration: none;
    }
    p a { color: #F1F3EC; }
    .small { font-size: 14px; }
    .copy {
      display: block; width: 100%; padding: 14px; border-radius: 999px;
      border: 1px solid rgba(244, 245, 247, .25); background: none; color: inherit;
      font: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="../logo.svg" data-en-src="../logo_en.svg" alt="REPотека">
    <h1 data-en="You're invited to a group">Тебя зовут в группу</h1>
    <p data-en="Friends give each other +REP and −REP with reasons. Open the invite in the app.">Друзья дают друг другу +REP и −REP с причинами. Открой приглашение в приложении.</p>
    <a class="open" id="open" href="#" data-en="Open in REPuchat">Открыть в REPотеке</a>
    <button class="copy" id="copy" type="button" data-en="Copy the invite">Скопировать приглашение</button>
    <p data-en="No app? Get it: <a href='https://t.me/repuchat'>Telegram</a> · RuStore and Google Play soon">Нет приложения? Скачай: <a href="https://t.me/repuchat">Telegram</a> · RuStore и Google Play — скоро</p>
    <p class="small" data-en="Have the app, but it didn't open? Open REPuchat → Join and paste the invite.">Приложение есть, но не открылось? Открой REPотеку → Вступить и вставь приглашение.</p>
  </main>
  <script>
    // Not Russian, the page speaks English: [data-en] takes its English text, the
    // logo its English picture.
    const en = !(navigator.language || 'ru').toLowerCase().startsWith('ru');
    if (en) {
      document.documentElement.lang = 'en';
      for (const el of document.querySelectorAll('[data-en]')) el.innerHTML = el.dataset.en;
      for (const el of document.querySelectorAll('img[data-en-src]')) {
        el.src = el.dataset.enSrc;
        el.alt = 'REPuchat';
      }
    }
    const token = location.hash.slice(1);
    // Chrome on Android opens an app by an intent link; elsewhere the app's own one.
    const android = /Android/i.test(navigator.userAgent);
    // Without the Android app (an iPhone, a computer): the web app takes it.
    const open = document.getElementById('open');
    open.href = android
      ? 'intent://join/' + token + '#Intent;scheme=repuchat;package=com.awi.repuchat;end'
      : '../app/#/?join=' + token;
    if (!android) open.textContent = en ? 'Open in the browser' : 'Открыть в браузере';
    document.getElementById('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        document.getElementById('copy').textContent = en ? 'Copied' : 'Скопировано';
      } catch (_) {
        prompt(en ? 'Copy the invite:' : 'Скопируй приглашение:', location.href);
      }
    };
    // The token, and an encrypted group's key after a dot.
    if (!/^[A-Za-z0-9_-]{43}(\.[A-Za-z0-9_-]{43})?$/.test(token)) {
      document.querySelector('h1').textContent = en ? 'Invite not found' : 'Приглашение не найдено';
      document.getElementById('open').style.display = 'none';
      document.getElementById('copy').style.display = 'none';
    }
  </script>
</body>
</html>
